name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Install trusted-publishing-capable npm
        run: npm install --global npm@11.5.1
      - name: Verify tag matches package version
        run: npm run release:tag -- "${GITHUB_REF_NAME}"
      - name: Run release checks and build artifact
        run: npm run release:check
        env:
          PACKAGE_SMOKE_OUTPUT_DIR: artifacts
      - name: Publish verified artifact with provenance
        run: npm publish artifacts/*.tgz --access public --provenance
